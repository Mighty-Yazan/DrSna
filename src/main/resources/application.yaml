spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/drtooth_db
    username: pguser
    password: pgpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:DrSnaClinicSuperSecretKeyForJwtTokens2026!!}