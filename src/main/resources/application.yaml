spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/drtooth_db
    username: pguser
    password: pgpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect