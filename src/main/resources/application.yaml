spring:
  application:
    name: demo
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


admin:
  seed:
    enabled: ${ADMIN_SEED_ENABLED:true}
    full-name: ${ADMIN_SEED_FULL_NAME}
    email: ${ADMIN_SEED_EMAIL}
    password: ${ADMIN_SEED_PASSWORD}
    city: ${ADMIN_SEED_CITY}


security:
  refresh-token:
    hmac-secret: ${REFRESH_TOKEN_HMAC_SECRET}
    cleanup-interval-ms: ${REFRESH_TOKEN_CLEANUP_INTERVAL_MS:3600000}