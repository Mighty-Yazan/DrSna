services:
  postgres:
    image: postgres:16-alpine
    container_name: drsna-postgres
    restart: always
    environment:
      POSTGRES_DB: drtooth_db
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d drtooth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: drsna-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/drtooth_db
      SPRING_DATASOURCE_USERNAME: pguser
      SPRING_DATASOURCE_PASSWORD: pgpassword
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: