version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: drsna-postgres
    restart: always
    environment:
      POSTGRES_DB: drtooth_db
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: